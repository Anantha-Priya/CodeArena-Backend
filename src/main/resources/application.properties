spring.application.name=codearena
spring.profiles.active=local

# Render (and most PaaS) inject PORT at runtime; 8080 stays the local-dev default.
server.port=${PORT:8080}

# No fallback here on purpose - a real secret must never live in this tracked file (that's
# exactly what application-local.properties, gitignored, is for). Locally, the "local" profile
# above loads application-local.properties, whose literal values take precedence over these
# placeholders entirely - they're never even evaluated. In production (no application-local.
# properties in the image, since it's gitignored and never copied in), these three env vars
# are required; boot fails fast and loudly if one is missing, which is what we want.
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

springdoc.swagger-ui.path=/swagger-ui.html

# Placeholder value per the build guide - fine to commit as the local-dev fallback, unlike a
# real DB password. Production must set JWT_SECRET; never rely on this placeholder there.
jwt.secret=${JWT_SECRET:sArkBmL6uyxXwibilY7XGgTRUh0deTIkinhgXI5dKLzdPfQ45ArSXnFf1deV3cofpgAGEnh4+JMKmOv/5nNVNQ==}
jwt.expiration-ms=86400000
